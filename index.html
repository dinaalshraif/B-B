    <style>
        /* خلفية تغطي الشاشة بالكامل */
        .background {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background: url("WhatsApp Image 2025-09-09 at 6.34.52 PM.jpeg") no-repeat center center;
            background-size: cover;

        }

        /* طبقة شفافية */
        .overlay {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.5); 
            z-index: -1;
        }

        body {
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .logo-container {

        }
        .logo {

            border-radius: 10px;
        }

        /* أزرار شفافة بلون وردي */
.button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80%;             /* أصغر من 90% */
    max-width: 250px;       /* أصغر من 300px */
    padding: 10px 15px;     /* أصغر من 15px 20px */
    margin-bottom: 8px;     /* أصغر من 10px */
    background-color: rgba(245, 169, 188, 0.6);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 14px;        /* تصغير الخط */
    transition: background-color 0.3s ease;
    backdrop-filter: blur(6px);
}

.button img {
    width: 20px;   /* أصغر من 24px */
    height: 20px;
    margin-left: 8px;  /* أصغر من 10px */
}

        .button:hover {
            background-color: rgba(230, 138, 171, 0.9); /* أغمق عند المرور */
        }

      

        /* مسافة بين الأيقونة النصية والنص */
        .icon {
            margin-left: 10px;
        }
    </style>
</head>
