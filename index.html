<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloons & Beyond - 🎈بالون و أكثر</title>
    <style>
        /* خلفية تغطي الشاشة بالكامل */
        .background {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background: url("WhatsApp Image 2025-09-09 at 6.34.52 PM.jpeg") no-repeat center center;
            background-size: cover;
            z-index: -2;
        }

        /* طبقة شفافية */
        .overlay {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.5); 
            z-index: -1;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .logo-container {
            margin-bottom: 15px;
            text-align: center;
        }
        .logo {
            max-width: 150px;
            height: auto;
            border-radius: 10px;
        }

        /* أيقونات التواصل (فوق فقط) */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 25px 0;
        }
        .social-icons img {
            width: 32px;
            height: 32px;
            transition: transform 0.3s ease;
        }
        .social-icons img:hover {
            transform: scale(1.2);
        }

        /* أزرار شفافة بلون وردي */
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            max-width: 250px;
            padding: 10px 15px;
            margin-bottom: 8px;
            background-color: rgba(245, 169, 188, 0.8);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s ease;
            backdrop-filter: blur(6px);
        }
        .button:hover {
            background-color: rgba(230, 138, 171, 0.9);
        }

        .button img {
            width: 18px;
            height: 18px;
            margin-left: 6px;
        }

        /* مسافة بين أيقونة العربة والنص */
        .button span {
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <!-- الخلفية -->
    <div class="background"></div>
    <div class="overlay"></div>

    <div class="logo-container">
        <img src="./B&B.jpeg" alt="شعار Balloons & Beyond" class="logo">

        <!-- أيقونات التواصل (فوق فقط) -->
        <div class="social-icons">
            <a href="https://www.instagram.com/balloons.and_beyond">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/instagram-new.png" alt="Instagram">
            </a>
            <a href="https://www.tiktok.com/@balloones.and_beyond">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/tiktok.png" alt="TikTok">
            </a>
            <a href="https://api.whatsapp.com/send?phone=966536299509">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/whatsapp--v1.png" alt="WhatsApp">
            </a>
            <a href="https://www.snapchat.com/add/ballonbeyond">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/snapchat.png" alt="Snapchat">
            </a>
        </div>
    </div>

    <!-- الأزرار -->
    <a href="https://balloons-sa.com/" class="button">
	 <img src="https://img.icons8.com/ios-filled/50/ffffff/shopping-cart.png" alt="Store">
         <span>الطلب عن طريق المتجر الإلكتروني</span>
    </a>
    <a href="https://api.whatsapp.com/send?phone=966536299509" class="button">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/whatsapp--v1.png" alt="WhatsApp">
        <span>للاستفسار تواصل معنا</span>
    </a>
    <a href="https://www.instagram.com/balloons.and_beyond" class="button">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/instagram-new.png" alt="Instagram">
        <span>تابعنا على انستقرام</span>
    </a>
    <a href="https://www.tiktok.com/@balloones.and_beyond" class="button">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/tiktok.png" alt="TikTok">
        <span>شاهدنا على تيك توك</span>
    </a>
    <a href="https://www.snapchat.com/add/ballonbeyond" class="button">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/snapchat.png" alt="Snapchat">
        <span>أضفنا على سناب شات</span>
    </a>

</body>
</html>
