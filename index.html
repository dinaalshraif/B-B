<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloons & Beyond - 🎈بالون و أكثر</title>
    <style>
        /* خلفية تغطي الشاشة بالكامل */
        .background {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background: url("WhatsApp Image 2025-09-09 at 6.34.52 PM.jpeg") no-repeat center center;
            background-size: cover;
            z-index: -2;
        }

        /* طبقة شفافية */
        .overlay {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.5); 
            z-index: -1;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .logo-container {
            margin-bottom: 20px;
        }
        .logo {
            max-width: 150px;
            height: auto;
            border-radius: 10px;
        }

        /* أزرار شفافة بلون وردي */
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 300px;
            padding: 15px 20px;
            margin-bottom: 10px;
            background-color: rgba(245, 169, 188, 0.6); /* وردي شفاف */
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            backdrop-filter: blur(6px); /* تأثير زجاجي */
        }
        .button:hover {
            background-color: rgba(230, 138, 171, 0.9); /* أغمق عند المرور */
        }

        .button img {
            width: 24px;
            height: 24px;
            margin-left: 10px;
        }

        /* مسافة بين الأيقونة النصية والنص */
        .icon {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <!-- الخلفية -->
    <div class="background"></div>
    <div class="overlay"></div>

    <div class="logo-container">
        <img src="./B&B.jpeg" alt="شعار Balloons & Beyond" class="logo">
    </div>

    <a href="https://salla.sa/balloons_beyond" class="button">
        <span class="icon">🛒</span>
        <span>الطلب عن طريق المتجر الإلكتروني</span>
    </a>

    <a href="https://api.whatsapp.com/send?phone=966536299509" class="button">
        <img src="https://img.icons8.com/color/48/whatsapp--v1.png" alt="WhatsApp">
        <span> للاستفسار تواصل معنا عبر واتساب</span>
    </a>

    <a href="https://www.instagram.com/balloons.and_beyond" class="button">
        <img src="https://img.icons8.com/fluency/48/instagram-new.png" alt="Instagram">
        <span>حسابنا على إنستقرام</span>
    </a>

    <a href="https://www.tiktok.com/@balloones.and_beyond?_t=ZS-8zG0YluNQsk&_r=1" class="button">
        <img src="https://img.icons8.com/color/48/tiktok--v1.png" alt="TikTok">
        <span>حسابنا على تيك توك</span>
    </a>

    <a href="https://www.snapchat.com/add/ballonbeyond?share_id=h-zKsJ4GiIg&locale=en-GB" class="button">
        <img src="https://img.icons8.com/color/48/snapchat--v1.png" alt="Snapchat">
        <span>حسابنا على سناب شات</span>
    </a>

</body>
</html>
