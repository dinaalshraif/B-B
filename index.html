<!DOCTYPE html>
<html lang="ar" dir="rtl">

            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f8f8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo {
            max-width: 150px;
            height: auto;
            border-radius: 10px;
        }
        .button {
            display: block;
            width: 300px;
            padding: 15px 20px;
            margin-bottom: 10px;
            background-color: #f5a9bc; /* لون وردي فاتح */
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #e68aab; /* لون أغمق قليلاً عند التhover */
        }
        .button span {
            margin-left: 10px; /* مسافة بين النص والأيقونة */
        }
    </style>
</head>
